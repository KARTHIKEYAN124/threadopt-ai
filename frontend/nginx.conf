map $request_method $experiment_limit_key {
 default "";
 POST $binary_remote_addr;
}
limit_req_zone $experiment_limit_key zone=experiments:10m rate=6r/m;
server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 16k;
 limit_req_status 429;
 location = /api/experiments {
  limit_req zone=experiments burst=3 nodelay;
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
 }
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
 location /ws/ {
  proxy_pass http://backend:8080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 300s;
 }
 location / { try_files $uri $uri/ /index.html; }
}
