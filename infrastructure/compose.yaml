services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: threadopt
      POSTGRES_USER: threadopt
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threadopt"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  ai:
    build: ../ai-service
    restart: unless-stopped
    mem_limit: 512m
  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/threadopt
      DB_USER: threadopt
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
    restart: unless-stopped
    mem_limit: 1g
    cpus: 4
  frontend:
    build: ../frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  pgdata:
